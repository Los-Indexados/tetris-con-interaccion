<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris con Interacción</title>
    <link rel="stylesheet" href="style.css">

    <!-- p5.js en modo global: habilita setup(), draw() y las constantes -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

    <!-- TensorFlow.js (incluye los backends CPU y WebGL) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <!-- Modelo de detección de manos (Google MediaPipe) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.0"></script>
</head>

<body>
    <!-- Contenedor raíz de la interfaz. El canvas del tablero se monta dentro
         del panel de la consola, y el de la cámara en el visor del panel. -->
    <main id="tetris-app"></main>

    <!-- Orden obligatorio: motor -> interfaz -> detección de manos -> integración p5 -->
    <script src="js/gamelogic.js"></script>
    <script src="js/interface.js"></script>
    <script src="js/handpose.js"></script>
    <script src="sketch.js"></script>
</body>
</html>

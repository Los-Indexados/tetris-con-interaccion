<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris con Interacción</title>
    <link rel="stylesheet" href="style.css">

    <!-- p5.js en modo global: habilita setup(), draw() y las constantes -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <!-- p5.sound: loadSound(), loop(), play() y efectos -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"></script>
</head>

<body>
    <!-- Contenedor raíz de la interfaz. El canvas del tablero se monta dentro
         del panel de la consola, no acá. -->
    <main id="tetris-app"></main>

    <!-- Orden obligatorio: motor -> interfaz -> integración p5 -->
    <script src="js/gamelogic.js"></script>
    <script src="js/interface.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
